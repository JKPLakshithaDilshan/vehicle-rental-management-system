<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Edit Seller Profile - Carbook</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css?family=Poppins:200,300,400,500,600,700,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/animate.css">
    <link rel="stylesheet" href="../assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="../assets/css/owl.theme.default.min.css">
    <link rel="stylesheet" href="../assets/css/magnific-popup.css">
    <link rel="stylesheet" href="../assets/css/aos.css">
    <link rel="stylesheet" href="../assets/css/ionicons.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap-datepicker.css">
    <link rel="stylesheet" href="../assets/css/jquery.timepicker.css">
    <link rel="stylesheet" href="../assets/css/flaticon.css">
    <link rel="stylesheet" href="../assets/css/icomoon.css">
    <link rel="stylesheet" href="../assets/css/style.css">
  </head>

  <body class="login-page-body">
    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
      <div class="container">
        <a class="navbar-brand" href="../index.html">Car<span>Book</span></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav" aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="oi oi-menu"></span> Menu
        </button>

        <div class="collapse navbar-collapse" id="ftco-nav">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a href="../index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="seller-register.html" class="nav-link">Seller Register</a></li>
            <li class="nav-item"><a href="seller-list.html" class="nav-link">Sellers</a></li>
            <li class="nav-item active"><a href="seller-edit.html" class="nav-link">Edit Seller</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="login-main-wrap">
      <section class="login-card signup-card" aria-labelledby="sellerEditHeading">
        <h1 id="sellerEditHeading" class="login-title">Edit Seller Profile</h1>
        <p class="login-subtitle">Open this page with `?sellerId=123` to edit that seller.</p>

        <form id="sellerEditForm" action="#" method="post" class="login-form" novalidate>
          <input id="sellerId" type="hidden">

          <label class="login-label" for="sellerEditName">Name</label>
          <input id="sellerEditName" type="text" class="login-input" required>

          <label class="login-label" for="sellerEditContact">Contact</label>
          <input id="sellerEditContact" type="text" class="login-input" required>

          <label class="login-label" for="sellerEditLocation">Location</label>
          <input id="sellerEditLocation" type="text" class="login-input" required>

          <label class="login-label" for="sellerEditType">Type</label>
          <select id="sellerEditType" class="login-input" required>
            <option value="individual">Individual Seller</option>
            <option value="dealer">Dealer</option>
          </select>

          <label class="login-label" for="sellerEditImage">Profile Image URL (optional)</label>
          <input id="sellerEditImage" type="url" class="login-input" placeholder="https://example.com/profile.jpg">

          <button type="submit" class="login-btn-primary">Save Changes</button>
        </form>

        <p id="sellerEditFeedback" class="auth-feedback" aria-live="polite"></p>
      </section>
    </main>

    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/js/jquery-migrate-3.0.1.min.js"></script>
    <script src="../assets/js/popper.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/jquery.easing.1.3.js"></script>
    <script src="../assets/js/jquery.waypoints.min.js"></script>
    <script src="../assets/js/jquery.stellar.min.js"></script>
    <script src="../assets/js/owl.carousel.min.js"></script>
    <script src="../assets/js/jquery.magnific-popup.min.js"></script>
    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/jquery.animateNumber.min.js"></script>
    <script src="../assets/js/bootstrap-datepicker.js"></script>
    <script src="../assets/js/jquery.timepicker.min.js"></script>
    <script src="../assets/js/scrollax.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/seller-ui.js"></script>
  </body>
</html>
