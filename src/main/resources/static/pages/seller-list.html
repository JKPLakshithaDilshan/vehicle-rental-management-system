  <body>
    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
      <div class="container">
        <a class="navbar-brand" href="../index.html">Car<span>Book</span></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav" aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="oi oi-menu"></span> Menu
        </button>

        <div class="collapse navbar-collapse" id="ftco-nav">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a href="../index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="car-single.html" class="nav-link">Cars</a></li>
            <li class="nav-item"><a href="seller-register.html" class="nav-link">Seller Register</a></li>

            <li class="nav-item cta"><a href="login.html" class="nav-link"><span>Login</span></a></li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="ftco-section">
      <div class="container">
        <div class="row justify-content-center mb-4">
          <div class="col-md-10 text-center heading-section ftco-animate">
            <span class="subheading">Sellers & Dealers</span>
            <h2>Browse Verified Sellers</h2>
            <p>Search by name or location and view approval status.</p>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-4 mb-2">
            <input id="sellerSearchName" type="text" class="form-control" placeholder="Search by name">
          </div>
          <div class="col-md-4 mb-2">
            <input id="sellerSearchLocation" type="text" class="form-control" placeholder="Search by location">
          </div>
          <div class="col-md-4 mb-2">
            <button id="sellerSearchBtn" type="button" class="btn btn-primary btn-block">Search</button>
          </div>
        </div>

        <p id="sellerListFeedback" class="auth-feedback" aria-live="polite"></p>

        <div class="table-responsive admin-table-wrap">
          <table class="table admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Type</th>
                <th>Location</th>
                <th>Contact</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="sellerListBody"></tbody>
          </table>
        </div>
      </div>
    </section>
